# Prompt library keyed by interaction_type.
# The selected key also determines reference_episodes/<interaction_type>/.
prompts:
  following_human: >-
    生成1个行人和1条机器人同向运动的直线路线,行人起点必须位于机器人起点正前方距离1m-2m之间,且行人初始yaw朝向必须和路径方向一致,
    行人路线为简单直线,终点与倒数第二个waypoint相隔1.5m-2m.机器人路径由多个waypoints构成,与行人路径完全重叠,
    从第一个waypoint开始到行人路径的倒数第二个点作为终点,使得机器人一直跟随行人运动轨迹.尽量选择长的走廊过道或宽阔区域规划路线,
    机器人社交属性为aggressive.

  robot_overtaking: >-
    生成1个行人和1条机器人同方向运动的直线路线,行人起点必须位于机器人起点正前方距离1m-2m之间,且行人初始yaw朝向必须和路径方向一致,
    机器人起点必须位于行人起点正后方（以路线运动方向为准）,机器人终点位于行人终点前方,两者路线都是没有大角度弯角(如90度弯角)的较长直线,
    尽量选择长的走廊过道或宽阔区域规划路线,机器人社交属性为aggressive.

  entering_room: >-
    生成1个行人和1条机器人相向运动的路线,行人和机器人起点分别位于房间内和房间外且就在门口两边,
    行人朝向正对房间外并向房间外移动,机器人朝向正对房间内并向房间内运动,二者路径冲突发生在该房间门口.
    行人出房间后路径应偏长远离房间门口,行人终点尽量位于开阔区域,机器人社交属性为passive,行人社交属性为passive,启用主动让行.

  exiting_room: >-
    生成1个行人和1条机器人相向运动的路线,行人和机器人起点分别位于同一房间门口外和内且都靠近门口,机器人起点必须非常靠近门口,
    行人向房间内移动,机器人向房间外运动,二者路径长度中等,路径冲突发生在该房间门口,尽量选择开阔的房间规划冲突场景,
    机器人路径为一条离开房间的简单直线路径,机器人社交属性为neutral,启用主动让行,行人社交属性为passive.

  frontal_approach: >-
    生成1个行人和1条机器人相向运动的路线,行人和机器人起点均位于过道中且必须相互靠近,二者运动方向相反并在过道中发生路径冲突,
    行人路径终点在过道之外,二者路径长度偏短或中等,行人社交属性为passive,机器人社交属性为neutral,启用主动让行.

  intersection: >-
    生成1个行人和1条机器人垂直交叉直线运动的路线,机器人和行人起点均位于由不同障碍物构成的十字路口或T字路口中,
    二者路线在路口中心交叉,且交叉点位于各自路径起始阶段的前三个waypoints之内,二者刚开始运动时就发生路径冲突,
    两者路线长度偏短到中等,机器人社交属性为passive,不启用主动让行.

  perpendicular_traffic: >-
    生成多个行人和1条机器人的运动路线,行人数量为1到3随机,每个行人路径长度中等,路径互相平行且靠近,
    不同行人的运动方向尽量不同,行人路径朝向随机,起点不能离机器人起点太远.机器人路径长度中等,
    基本垂直于所有行人路径且必须横穿所有行人路径.尽量选择开阔的房间规划冲突场景,机器人社交属性为passive.

  prallel_traffic: >-
    生成多个行人和1条机器人的运动路线,每个行人以及机器人运动路线均为中等长度直线,路径互相平行且靠近,
    各自路径朝向随机,尽量选择开阔的房间规划冲突场景,机器人社交属性为aggressive.
